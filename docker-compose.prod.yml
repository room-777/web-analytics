services:
  glance:
    build:
      context: ./server
    image: ghcr.io/chrisgreg/glance:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      GLANCE_DATABASE_PATH: /data/glance.db

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    depends_on:
      - glance
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
