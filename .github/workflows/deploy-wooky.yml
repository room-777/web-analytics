name: Deploy wooky web analytics

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wooky-web-analytics-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, wooky-vm]

    steps:
      - name: Deploy on Oracle VM
        run: |
          set -euo pipefail

          cd /srv/glance
          git pull --ff-only origin main

          docker compose \
            -f docker-compose.prod.yml \
            up -d \
            --build \
            --remove-orphans

          curl --fail --silent --show-error \
            http://127.0.0.1:8082/health

          docker compose \
            -f docker-compose.prod.yml \
            ps
